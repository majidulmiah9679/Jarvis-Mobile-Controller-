
name: Build JARVIS APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Prepare Web Assets & Install Dependencies
        run: |
          npm install
          # যদি React/Vite/Vue প্রজেক্ট হয় তবে build চালাবে
          npm run build --if-present
          # যদি www ফোল্ডার না থাকে তবে অটোমেটিক তৈরি করে index.html বানিয়ে দেবে
          if [ ! -d "www" ]; then
            mkdir -p www
            if [ -f "index.html" ]; then
              cp index.html www/
            else
              echo "<!DOCTYPE html><html><head><title>JARVIS</title></head><body><h1>JARVIS Mobile Online</h1></body></html>" > www/index.html
            fi
          fi

      - name: Build Android App with Capacitor
        run: |
          npm install -g @capacitor/cli @capacitor/core @capacitor/android
          npx cap add android || true
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
