name: Build JARVIS APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Auto Setup Web & Capacitor
        run: |
          if [ ! -f "package.json" ]; then
            npm init -y
          fi

          npm install @capacitor/core @capacitor/cli @capacitor/android

          mkdir -p www
          if [ -f "index.html" ]; then
            cp -r * www/ 2>/dev/null || true
          elif [ ! -f "www/index.html" ]; then
            echo "<!DOCTYPE html><html><head><title>JARVIS</title></head><body><h1>JARVIS Mobile Online</h1></body></html>" > www/index.html
          fi

          cat <<EOF > capacitor.config.json
          {
            "appId": "com.jarvis.controller",
            "appName": "JARVIS Controller",
            "webDir": "www"
          }
          EOF

          npx cap add android || true
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean --no-daemon
          ./gradlew assembleDebug --no-daemon --no-parallel

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
