name: Build JARVIS APK
on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix Capacitor Config
        run: |
          echo '{"name":"jarvis","version":"1.0","main":"index.html","scripts":{}}' > package.json
          mkdir -p www
          cp index.html www/index.html || cp *.html www/ 2>/dev/null || echo "copying"
          echo '{"appId":"com.jarvis.app","appName":"JARVIS","webDir":"www","bundledWebRuntime":false}' > capacitor.config.json

      - name: Build APK
        run: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/android
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
